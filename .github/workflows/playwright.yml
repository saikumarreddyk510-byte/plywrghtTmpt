# CI wiring for the AI test-automation pipeline (docs/architecture.md §11-12).
#
# Three layers, none of them a hard dependency on the ones above them:
#   - `test`             — deterministic. Always runs, no AI vendor needed.
#                           Runs the framework exactly as `npm run
#                           pw:test[:smoke]` would locally.
#   - `triage-baseline`   — deterministic. Runs whenever `test` fails, no AI
#                           vendor needed. Posts the raw evidence (failing
#                           test names, an error excerpt, links to the
#                           uploaded artifacts) as a PR comment or a tracked
#                           GitHub issue. This is the value floor: CI produces
#                           a real signal with zero AI configured anywhere.
#   - `review` / `triage` — AI-driven, optional enrichment. Only run if
#                           ANTHROPIC_API_KEY is set as a repo secret; skipped
#                           cleanly (not failed) otherwise, and appends to
#                           (never replaces) what triage-baseline already
#                           posted. Never block the PR by themselves — see
#                           `continue-on-error` below and "What stays
#                           human-gated" in docs/roadmap.md.
#
# No job here is Claude-Code-specific or Anthropic-specific except the two
# explicitly named `claude -p` invocations below — everything else (the
# framework, the deterministic baseline) works with no AI vendor at all.
# If you're driving this pipeline from GitHub Copilot instead of Claude Code:
# GitHub's Copilot coding agent (assign-to-@copilot on an issue) is a real
# option for picking up the issue `triage-baseline` files on a nightly
# failure, but it's issue-driven and asynchronous — it doesn't fit the
# "run a step, get output back in this job" shape the `review`/`triage` jobs
# use, so it isn't scripted here. Assign the filed issue manually if you want
# Copilot's coding agent to attempt it.
#
# `test` runs on windows-latest on purpose: the framework's logging path
# (`C:\LogFolder\...`) and Allure teardown are Windows-specific by design
# (see CLAUDE.md) — this is the runner that matches local dev, not a
# workaround. Every other job runs on ubuntu-latest for cheaper, faster
# compute (they only read files, never touch that logging path).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   BASE_URL, APP_USER, APP_PASSWORD   — same values as your local .env
#   ANTHROPIC_API_KEY                  — optional; only needed for the
#                                         `review` / `triage` enrichment jobs
#
# First-run note: the `claude -p` invocations use the CLI's non-interactive
# "print mode". Flags for permission handling in CI
# (`--dangerously-skip-permissions`) can change between CLI versions — if
# `review`/`triage` fail on their first run, check `claude --help` in the job
# log against the flags used here before assuming the skill itself is broken.
# `test` and `triage-baseline` have no such dependency and should work as
# written.

name: Playwright Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly full regression, 03:00 UTC
  workflow_dispatch: {}

jobs:
  # ── Tier 0: the skills themselves are lint-able artifacts ────────────────
  # A skill with malformed frontmatter never loads and a skill pointing at a
  # renamed file sends the agent to a dead path — both fail silently at run
  # time. Cheapest job in the workflow; catches the whole class in seconds.
  lint-skills:
    name: Validate Claude skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run skills:validate

  test:
    name: Run Playwright tests
    runs-on: windows-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      PW_SPEC_NAME: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chrome

      - name: Smoke tests (pull request)
        if: github.event_name == 'pull_request'
        run: npm run pw:test:smoke

      - name: Full regression (scheduled / manual)
        if: github.event_name != 'pull_request'
        run: npm run pw:test

      - name: Upload Allure results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: C:/LogFolder/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload run history
        # .test-history/runs.jsonl is what /detect-flaky and /run-report reason
        # over. Uploading it keeps CI runs part of the same history a developer
        # sees locally, instead of each environment judging flakiness alone.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-history
          path: .test-history/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload raw traces + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ── Tier 0: deterministic failure signal, no AI vendor required ──────────
  triage-baseline:
    name: Post failure evidence (no AI required)
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.post.outputs.issue_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: ci-artifacts/allure-results
        continue-on-error: true

      - name: Extract a failure excerpt from out.txt
        id: excerpt
        shell: bash
        run: |
          FILE=$(find ci-artifacts/allure-results -name out.txt 2>/dev/null | head -n1)
          {
            echo "excerpt<<PLAYWRIGHT_EOF"
            if [ -n "$FILE" ]; then
              grep -B2 -A8 -iE "fail|error|timeout" "$FILE" | tail -n 80
            else
              echo "No out.txt found in the downloaded artifacts."
            fi
            echo "PLAYWRIGHT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post evidence
        id: post
        uses: actions/github-script@v7
        with:
          script: |
            const excerpt = `${{ steps.excerpt.outputs.excerpt }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "### ❌ Playwright run failed",
              "",
              `**Workflow run:** ${runUrl}`,
              "",
              "**Failure excerpt (out.txt):**",
              "```",
              excerpt || "(no excerpt available)",
              "```",
              "",
              "Full Allure results and raw traces/screenshots are attached to the workflow run above.",
              "",
              "_Posted automatically, no AI involved — see `docs/architecture.md` §11._",
            ].join("\n");

            if (context.eventName === "pull_request") {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              return;
            }

            // Not a PR (scheduled/manual run) — file or update a tracked issue.
            const title = `[CI] Nightly Playwright regression failing`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "needs-triage",
            });
            const match = existing.data.find((i) => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                issue_number: match.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
              core.setOutput("issue_number", match.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["needs-triage"],
              });
              core.setOutput("issue_number", created.data.number);
            }

  # ── Tier 1: optional AI enrichment of what Tier 0 already posted ─────────
  review:
    name: AI review of changed specs
    needs: test
    if: always() && github.event_name == 'pull_request' && secrets.ANTHROPIC_API_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      - name: Find changed specs / page objects
        id: diff
        shell: bash
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'playwright/e2e/*.spec.ts' 'playwright/support/pageObjects/*-po.ts' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run /review-tests
        if: steps.diff.outputs.files != ''
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/review-tests ${{ steps.diff.outputs.files }}" \
            --output-format text \
            --dangerously-skip-permissions > review-output.md

      - name: Comment on PR
        if: steps.diff.outputs.files != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('review-output.md')
              ? fs.readFileSync('review-output.md', 'utf8')
              : '_review-tests did not produce output — check the job log._';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 \`/review-tests\`\n\n${body}`,
            });

  triage:
    name: AI triage on failure (enrichment)
    needs: [test, triage-baseline]
    if: failure() && secrets.ANTHROPIC_API_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: ci-artifacts/allure-results
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ci-artifacts/test-results
        continue-on-error: true

      - name: Run /triage-failure
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/triage-failure — evidence is under ci-artifacts/ (allure-results and test-results downloaded from the failed 'test' job)" \
            --output-format text \
            --dangerously-skip-permissions > triage-output.md

      - name: Post enrichment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('triage-output.md')
              ? fs.readFileSync('triage-output.md', 'utf8')
              : '_triage-failure did not produce output — check the job log._';
            const formatted = `### 🚨 \`/triage-failure\` (AI enrichment of the evidence posted above)\n\n${body}`;

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: formatted,
              });
              return;
            }

            const issueNumber = '${{ needs.triage-baseline.outputs.issue_number }}';
            if (issueNumber) {
              await github.rest.issues.createComment({
                issue_number: Number(issueNumber),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: formatted,
              });
            } else {
              await core.summary.addRaw(formatted).write();
            }
