# CI/CD wiring for the test framework (docs/cicd.md, docs/architecture.md §11-12).
#
# Jobs, none of them a hard dependency on the others:
#   - `lint-skills`    — validates the .claude/skills catalog. A skill with bad
#                        frontmatter never loads and one pointing at a renamed
#                        file sends the agent to a dead path; both fail silently
#                        at run time. Cheapest job here, catches the whole class.
#   - `quality`        — lint + typecheck. The same two commands
#                        .githooks/pre-push runs locally; this is the copy that
#                        actually enforces them, since a hook can be bypassed.
#   - `test`           — the suite, exactly as `npm run pw:test[:smoke]` runs it
#                        locally. Deterministic; no AI vendor involved.
#   - `publish-report` — the CD job. Deploys the HTML report to GitHub Pages.
#                        Off unless you opt in; see the job's own comment.
#   - `review`         — optional AI review of changed specs. Runs only when
#                        ANTHROPIC_API_KEY is set, skips cleanly (not fails)
#                        otherwise, and never blocks a PR by itself — see
#                        `continue-on-error` and "What stays human-gated" in
#                        docs/roadmap.md.
#
# When it runs (see the `on:` block and the "Select suite" step):
#   push (any branch)    -> FULL suite. The point of the push trigger: the code
#                           you just pushed is exercised together with every
#                           test already in the repo, so a new spec cannot pass
#                           in isolation while quietly breaking an existing one.
#   pull_request -> main -> smoke only. Fast gate; the merge push runs full.
#   schedule (03:00 UTC) -> smoke only. The daily health check against the live
#                           app, catching drift on days nobody pushed.
#   workflow_dispatch    -> operator picks full or smoke from the dropdown.
#
# Every run uploads its HTML reports as workflow artifacts — see "Reports" in
# the `test` job. That is where failure evidence lives: the Playwright HTML
# report embeds the trace, screenshot and error for each failing test, so a red
# run is diagnosable from the artifact alone.
#
# `test` runs on windows-latest on purpose: the framework's logging path
# (`C:\LogFolder\...`) and Allure teardown are Windows-specific by design
# (see CLAUDE.md) — this is the runner that matches local dev, not a
# workaround. Every other job runs on ubuntu-latest for cheaper, faster
# compute (they only read files, never touch that logging path).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   BASE_URL, APP_USER, APP_PASSWORD   — same values as your local .env
#   ANTHROPIC_API_KEY                  — optional; only the `review` job uses it
#
# First-run note: the `claude -p` invocation uses the CLI's non-interactive
# "print mode". Flags for permission handling in CI
# (`--dangerously-skip-permissions`) can change between CLI versions — if
# `review` fails on its first run, check `claude --help` in the job log against
# the flags used here before assuming the skill itself is broken. Every other
# job is free of that dependency.

name: Playwright Tests

# GITHUB_TOKEN defaults to read-only on repos created since 2023, and a job
# that writes without saying so gets a 403. Default to read-only here and
# widen only the jobs that actually write.
permissions:
  contents: read

on:
  push:
    branches: ["**"] # every push, any branch: run the new code AND the existing suite
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # daily smoke run, 03:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        type: choice
        default: full
        options: [full, smoke]

# A newer push to the same branch supersedes the run already in flight, so a
# burst of commits costs one run instead of five. Scheduled runs sit in their
# own group: the daily smoke must never be cancelled by someone pushing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'daily-smoke' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ── Tier 0: the skills themselves are lint-able artifacts ────────────────
  # A skill with malformed frontmatter never loads and a skill pointing at a
  # renamed file sends the agent to a dead path — both fail silently at run
  # time. Cheapest job in the workflow; catches the whole class in seconds.
  lint-skills:
    name: Validate Claude skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run skills:validate

  # ── Tier 0: code quality ─────────────────────────────────────────────────
  # The .githooks/pre-push hook runs exactly these two commands locally, so this
  # job is normally a no-op. It exists because a hook is advisory — anyone can
  # `git push --no-verify`, and a fresh clone only gets the hooks once someone
  # runs `npm install`. This is the copy that actually enforces the standard.
  quality:
    name: Lint + format + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (prettier formatting rules run inside it)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

  # GitHub does not expose the `secrets` context to a job-level `if:` - only
  # github/needs/vars/inputs. Referencing it there ("Unrecognized named-value:
  # 'secrets'") makes the ENTIRE workflow file fail to parse, taking the test
  # jobs down with it. Resolve the key once here, where `env` is legal, and gate
  # the optional AI jobs on this output instead.
  config:
    name: Resolve optional AI config
    runs-on: ubuntu-latest
    outputs:
      has_ai: ${{ steps.check.outputs.has_ai }}
    steps:
      - id: check
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ai=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Playwright tests
    runs-on: windows-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      PW_SPEC_NAME: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install chrome

      # globalTeardown skips Allure HTML generation entirely when `java` is
      # missing (see globalTeardown.ts) - which would leave the report artifact
      # empty. Pinning a JDK here is what makes the HTML report reliable.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # One place decides which suite runs, so the mapping stays readable:
      #   push              -> full   (the pushed code plus everything already there)
      #   pull_request      -> smoke  (fast gate; merging to main then runs full)
      #   schedule          -> smoke  (the daily smoke run)
      #   workflow_dispatch -> whatever the operator picked (default: full)
      - name: Select suite
        id: suite
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request|schedule) SUITE=smoke ;;
            workflow_dispatch)     SUITE="${{ inputs.suite }}" ;;
            *)                     SUITE=full ;;
          esac
          # A blank value here would match neither run step below, and the job
          # would report success having executed nothing. Fail closed to full.
          if [ -z "$SUITE" ]; then SUITE=full; fi
          echo "name=$SUITE" >> "$GITHUB_OUTPUT"
          echo "### Playwright: \`$SUITE\` suite (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke suite
        if: steps.suite.outputs.name == 'smoke'
        run: npm run pw:test:smoke

      - name: Full suite
        if: steps.suite.outputs.name == 'full'
        run: npm run pw:test

      # ── Reports ───────────────────────────────────────────────────────────
      # Three artifacts rather than one bundle, because they answer different
      # questions: the Playwright HTML report is the one to open first (it needs
      # no Java and embeds traces), Allure is the richer project-standard
      # report, and the raw results are what /detect-flaky and /run-report
      # reason over locally.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_number }}
          path: playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ github.run_number }}
          path: C:/LogFolder/*/allure-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure raw results + run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: C:/LogFolder/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload run history
        # .test-history/runs.jsonl is what /detect-flaky and /run-report reason
        # over. Uploading it keeps CI runs part of the same history a developer
        # sees locally, instead of each environment judging flakiness alone.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-history
          path: .test-history/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload raw traces + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ── CD: deploy the one artifact this repo actually produces ──────────────
  # CI answers "is the code good". This is the other half: it takes the build
  # output and puts it somewhere people can reach, at a stable URL, without
  # downloading a zip from the Actions tab.
  #
  # OFF by default, deliberately. A template that publishes to the internet the
  # moment someone clones it is a trap — reports carry test names, target URLs
  # and failure screenshots. Two steps to turn it on:
  #   1. Settings → Pages → Source: "GitHub Actions"
  #   2. Settings → Secrets and variables → Actions → Variables:
  #      PUBLISH_REPORT = true
  # `vars` (unlike `secrets`) IS a legal context in a job-level `if:`.
  publish-report:
    name: Publish HTML report to Pages
    needs: test
    if: always() && vars.PUBLISH_REPORT == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # A real deployment environment, with the deployed URL surfaced on the run.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Pages allows one deployment at a time, and a half-finished deploy should
    # never be cancelled — hence cancel-in-progress: false, unlike the CI jobs.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_number }}
          path: report

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - id: deploy
        uses: actions/deploy-pages@v4

  # ── Optional AI enrichment (skipped cleanly when no key is set) ──────────
  review:
    name: AI review of changed specs
    needs: [test, config]
    if: always() && github.event_name == 'pull_request' && needs.config.outputs.has_ai == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g @anthropic-ai/claude-code

      - name: Find changed specs / page objects
        id: diff
        shell: bash
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'playwright/e2e/*.spec.ts' 'playwright/support/pageObjects/*-po.ts' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run /review-tests
        if: steps.diff.outputs.files != ''
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/review-tests ${{ steps.diff.outputs.files }}" \
            --output-format text \
            --dangerously-skip-permissions > review-output.md

      - name: Comment on PR
        if: steps.diff.outputs.files != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('review-output.md')
              ? fs.readFileSync('review-output.md', 'utf8')
              : '_review-tests did not produce output — check the job log._';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 \`/review-tests\`\n\n${body}`,
            });
